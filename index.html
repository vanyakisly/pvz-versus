function rend(){let h=role=='h';
 $('pg').innerHTML=pool.map((d,i)=>`<button class="k cardb${pick.includes(i)?' on':''}" data-i=${i}>${cardH(d,h)}<em>${d[0]}</em></button>`).join('');
 $('sl').innerHTML=[0,1,2,3,4].map(k=>pick[k]!=null?`<button class="k cardb" data-r=${k}>${cardH(pool[pick[k]],h)}<em>${pool[pick[k]][0]}</em></button>`:'<div class=slot></div>').join('');
 $('pg').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,k=pick.indexOf(i);if(k>=0)pick.splice(k,1);else if(pick.length<5)pick.push(i);rend()});
 $('sl').querySelectorAll('button').forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.r,1);rend()});$('pn').textContent=pick.length+'/5 seeds'}
function choose(){$('lob').style.display='none';$('pk').style.display='flex';pool=role=='h'?PD:ZD;pick=[role=='h'?0:6];
 $('pt').textContent=role=='h'?'Choose your plants':'Choose your zombies';rend();
 $('rd').onclick=()=>{if(!pick.length||rdy)return;rdy=1;$('rd').textContent='Waiting for opponent…';if(role=='g')conn.send({rd:1});else if(orr)start()}}
function start(){mus('lawn');snd('readysetplant');$('lob').style.display='none';$('pk').style.display='none';let h=role=='h',P=h?PD:ZD;
 $('hud').innerHTML=`<div id=cb><span id=ic>${h?'<i class=sunic></i>':'🧠'}</span><b id=v>0</b></div>`+pick.map(i=>`<button class="k p" data-i=${i}>${cardH(P[i],h)}</button>`).join('')+(h?'<button class="k sv" id=sv title="Shovel"><svg width=40 height=60 viewBox="0 0 40 60"><rect x=17 y=2 width=6 height=30 rx=3 fill=#c9965a stroke=#4a2b11 transform="rotate(-18 20 30)"/><path d="M6 36 L30 30 L34 52 L12 56 Z" fill=#b9c1ca stroke=#454b53 stroke-width=2 transform="rotate(-18 20 40)"/></svg></button>':'')+'<span id=t></span>';
 document.querySelectorAll('.k.p').forEach(b=>b.onclick=()=>sel=+b.dataset.i);if(h)$('sv').onclick=()=>sel=-2;
 if(!h)(function G(){draw();requestAnimationFrame(G)})();if(h){S={t:0,sun:150,br:100,pl:[],zs:[],ps:[],su:[],gs:[],id:0,sk:2,over:0,cd:{},ev:[],fx:[]};let last=performance.now(),ls=0;
  (function L(n){tick(Math.min(.1,(n-last)/1e3));last=n;draw();if(n-ls>50||S.over){ls=n;conn.send({s:S});S.ev=[]}requestAnimationFrame(L)})(last)}}
function setup(c){conn=c;c.on('data',d=>{if(role=='h'){if(d.rd){orr=1;if(rdy)start()}else if(d.z!=null&&S)zin(d.z,d.r,d.c);else if(d.pk!=null&&S){let q=S.su.find(o=>o.id==d.pk&&o.k=='brain');if(q){S.su=S.su.filter(o=>o!=q);S.br+=25;ev('sun')}}}else if(d.s){S=d.s;S.ev.forEach(snd);if(!$('v'))start()}});
 c.on('close',()=>{$('pk').style.display='none';$('lob').style.display='flex';$('lob').innerHTML='<div><h1>Opponent left</h1><button class=k onclick=location.reload()>Back</button></div>'});
 c.open?choose():c.on('open',choose)}
$('h').onclick=()=>{mus('seed');role='h';let id=Math.random().toString(36).slice(2,6),p=new Peer('pvzvs-'+id);p.on('open',()=>$('st').textContent='Room code: '+id+' — give it to your opponent and wait…');p.on('connection',setup);p.on('error',e=>$('st').textContent='Error: '+e.type)};
$('j').onclick=()=>{mus('seed');role='g';$('st').textContent='Connecting…';let p=new Peer();p.on('open',()=>setup(p.connect('pvzvs-'+$('code').value.trim().toLowerCase())));p.on('error',e=>$('st').textContent='Error: '+e.type)};

const HP=["Howdy, neighbor! I'm Crazy Dave. This is a two-player fight: one of you plants, the other one brings the zombies!",
"The goal: the plant player must hold out for 5 minutes. The zombie player wins by getting any zombie across the lawn and into the house!",
"Plant player: click falling sun to collect it. Pick a seed from the top bar, then click a lawn tile to plant it. Sunflowers pop out extra sun for you to click, and every seed needs a moment to recharge.",
"Zombie player: you earn brains over time. Pick a zombie, then click the row where you want it to walk in. Gravestones are your sunflowers! Put them on any free tile and they pop out brains - click the brains to collect them!",
"Plant tips: Cherry Bombs blast zombies - and gravestones! A Chomper eats one zombie and then chews for 30 seconds before it can eat again. Squash flattens whatever walks up. Puff-shrooms are free but short range. Wall-nuts stall zombies. Snow Peas slow them down. Use the shovel to dig up a plant you don't want.",
"Zombie tips: Pole Vaulters hop over the first plant. Footballs are fast and tough. Cones and buckets crack and fall off when shot. Tear a Newspaper Zombie's paper and it goes berserk and sprints! Rush one lane while the plants are busy, and keep a few gravestones going for brains!",
"Before the match you each pick up to 5 seeds, then hit Ready. Share your room code with a friend to play online. The match keeps running while you read this, so be quick, neighbor!",
"That's it! Go protect your brains... or go eat them! You can open me again any time with the Help button."];
let hi=0,dvx=$('dv').getContext('2d');(function D(){if($('hp').style.display=='flex'){dvx.clearRect(0,0,300,430);dr(dvx,'dave','talk',performance.now()/1e3,150,420,.95)}requestAnimationFrame(D)})();
const help=o=>{$('hp').style.display=o?'flex':'none';if(o){hi=0;page()}};
function page(){$('ht').textContent=HP[hi];$('hn').textContent=(hi+1)+'/'+HP.length;$('hb2').style.visibility=hi?'visible':'hidden';$('hf').textContent=hi==HP.length-1?'Done':'Next';
 if(!mute){let a=new Audio('assets/dave'+(1+Math.floor(Math.random()*3))+'.mp3');a.volume=.6;a.play().catch(()=>{})}}
$('hb').onclick=()=>help(1);$('hx').onclick=()=>help(0);$('hb2').onclick=()=>{hi--;page()};$('hf').onclick=()=>{if(hi==HP.length-1)help(0);else{hi++;page()}};
addEventListener('keydown',e=>{if(e.key=='Escape')help(0)});
</script>
